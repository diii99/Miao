<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>乐 · 苗乡消消乐</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="game">
  <header class="top"><div class="brand"><span class="seal">乐</span><div><b>苗乡消消乐</b><small>指尖相连 · 苗乡拾趣</small></div></div><button class="help" id="help">玩法</button></header>
  <section class="stats" aria-label="本局进度">
    <div class="stat"><span>剩余步数</span><b id="moves">—</b></div>
    <div class="stat goal"><span>收集好物</span><b id="progress">准备出发</b><div class="goal-track" id="track" role="progressbar" aria-label="收集进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progressbar"></i></div></div>
    <div class="stat"><span>本局得分</span><b id="score">0</b></div>
  </section>
  <section class="levels" aria-label="选择难度"><button data-level="easy">轻松 · 6×6</button><button data-level="medium">适中 · 7×7</button><button data-level="hard">挑战 · 8×8</button></section>
  <div class="theme-row"><label for="theme">图案集</label><select id="theme"><option value="all">苗乡好物</option><option value="indigo">靛蓝纹样</option><option value="daily">食材银饰</option></select><button id="collection" class="text-button">图鉴 · 21 款 ↗</button></div>
  <p class="tip" id="tip" role="status">交换相邻好物，连成 3 个或更多</p>
  <section class="board-wrap"><div class="board" id="board" aria-label="消消乐棋盘"></div></section>
  <div class="round-patterns" id="round-patterns" aria-label="本局图案"></div>
  <div class="tools"><button id="hint"><span aria-hidden="true">✧</span> 提示</button><button id="shuffle"><span aria-hidden="true">↻</span> 换个排列 <small id="shuffle-count">2</small></button><button id="restart">重新开始</button></div>
  <footer class="footer"><span>点击或滑动交换 · 无效交换不扣步数</span><span id="best">最佳 0</span></footer>
</main>
<dialog id="overlay" aria-labelledby="dialog-title"><div class="card" id="card"></div></dialog>
<script type="module" src="./game.js"></script>
</body>
</html>
