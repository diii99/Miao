<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>乐 · 苗乡消消乐</title>
  <style>
    :root{font-family:"Noto Serif SC","Microsoft YaHei",serif;color:#173f63;background:#e9f3f2}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;background:radial-gradient(circle at 50% -20%,#fff8dc 0,#d7ebe8 44%,#a9cbd0 100%)}
    #game{position:relative;width:min(100%,480px);height:100dvh;overflow:hidden;background:linear-gradient(#ecf6ef 0%,#c4e0da 100%)}
    #game:before,#game:after{content:"";position:absolute;z-index:0;opacity:.2;pointer-events:none;background:url("/消消乐/image/图案_6.png") center/contain no-repeat}#game:before{width:250px;height:250px;top:22px;right:-72px;transform:rotate(20deg)}#game:after{width:220px;height:220px;bottom:42px;left:-90px;transform:rotate(-22deg)}
    header,.stats,.board-wrap,.footer{position:relative;z-index:1}.top{height:70px;padding:14px 18px 7px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.seal{width:39px;height:39px;display:grid;place-items:center;border:2px solid #b53b33;border-radius:50%;font-size:24px;font-weight:900;color:#b53b33;transform:rotate(-7deg);background:#fff8e9;box-shadow:0 3px 9px #8a443333}.brand b{font-size:20px;letter-spacing:.12em}.brand small{display:block;margin-top:2px;color:#638a89;font-size:10px;letter-spacing:.13em}.help{border:1px solid #86aaa9;border-radius:99px;background:#ffffffa8;color:#346b71;font:inherit;font-size:12px;padding:7px 11px}
    .stats{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;padding:0 15px}.stat{min-height:56px;padding:8px 10px;border:1px solid #ffffffc9;border-radius:14px;background:#ffffffa8;box-shadow:0 5px 14px #315d6120;text-align:center}.stat span{display:block;color:#65827d;font-size:10px;letter-spacing:.12em}.stat b{display:block;margin-top:3px;color:#17465d;font-size:18px;line-height:1}.goal b{font-size:14px;color:#b36b35}.goal-track{height:6px;margin-top:7px;overflow:hidden;border-radius:99px;background:#d1e3db}.goal-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ddad52,#e17648);transition:width .25s}
    .levels{display:flex;justify-content:center;gap:7px;padding:11px 15px 7px}.levels button{border:1px solid #a6c2be;border-radius:99px;padding:6px 13px;background:#edf7f4;color:#567a78;font:inherit;font-size:11px;letter-spacing:.08em}.levels button.on{color:#fff;background:#216e75;border-color:#216e75;box-shadow:0 4px 9px #216e7544}
    .tip{min-height:26px;margin:0;text-align:center;color:#46716e;font-size:12px}.board-wrap{width:min(96vw,405px);margin:0 auto;padding:8px;border:2px solid #fef6dc;border-radius:24px;background:linear-gradient(145deg,#2c7576,#155560);box-shadow:0 10px 24px #17495259,inset 0 0 0 3px #5f9c91}.board{display:grid;gap:4px}.tile{position:relative;aspect-ratio:1;border:0;border-radius:12px;background:linear-gradient(145deg,#fdf6df,#e8f0da);box-shadow:inset 0 -3px #b8ccbd,inset 0 1px #fff,0 2px 2px #052d3033;cursor:pointer;padding:5px;transition:transform .14s,filter .14s}.tile img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 2px 1px #274a4033);pointer-events:none}.tile.selected{outline:3px solid #ffe47a;outline-offset:-2px;transform:translateY(-3px);filter:brightness(1.08)}.tile.pop{animation:pop .3s ease both}@keyframes pop{45%{transform:scale(1.22) rotate(7deg);opacity:.7}100%{transform:scale(.2);opacity:0}}
    .footer{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;color:#416b6b;font-size:11px}.restart{border:0;border-radius:99px;padding:8px 13px;background:#fff7de;color:#9b5b36;font:inherit;font-size:11px;box-shadow:0 3px 7px #5b554026}.character{position:absolute;z-index:1;right:-21px;bottom:0;width:122px;height:175px;object-fit:contain;object-position:bottom;opacity:.64;pointer-events:none;filter:drop-shadow(0 2px 5px #30565044)}
    .overlay{position:absolute;z-index:5;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:#113f4bb0;backdrop-filter:blur(4px)}.overlay.show{display:flex}.card{width:min(100%,350px);padding:27px 24px 22px;border:2px solid #fff4cd;border-radius:24px;text-align:center;background:linear-gradient(145deg,#fffced,#e2f0df);box-shadow:0 18px 45px #062b354d}.card .seal{margin:0 auto 10px}.card h1{margin:0;color:#164d5c;font-size:27px;letter-spacing:.13em}.card p{color:#56756e;font-size:13px;line-height:1.8}.card .large{margin:11px 0 3px;color:#bd623d;font-size:30px;font-weight:900}.card button{margin-top:10px;border:0;border-radius:99px;padding:11px 22px;color:#fff;background:#1e7176;font:inherit;font-size:14px;box-shadow:0 5px 12px #18565b55}.difficulty{display:grid;gap:8px;margin:17px 0 4px}.difficulty button{margin:0;text-align:left;background:#fffdf3;color:#285f65;border:1px solid #b7d1c6;box-shadow:none}.difficulty button b{display:block;color:#b8633c;font-size:13px}.difficulty button small{display:block;margin-top:2px;color:#708a80;font-size:11px}
    @media(min-width:540px) and (min-height:700px){#game{height:min(850px,95dvh);border-radius:28px;box-shadow:0 25px 65px #16465055}.board-wrap{margin-top:6px}.character{width:145px;height:205px}}
  </style>
</head>
<body><main id="game">
  <header class="top"><div class="brand"><span class="seal">乐</span><div><b>苗乡消消乐</b><small>消去一格，遇见一味苗乡</small></div></div><button class="help" id="help">玩法</button></header>
  <section class="stats"><div class="stat"><span>步数</span><b id="moves">20</b></div><div class="stat goal"><span>收集苗乡好物</span><b id="progress">0 / 24</b><div class="goal-track"><i id="progressbar"></i></div></div><div class="stat"><span>得分</span><b id="score">0</b></div></section>
  <section class="levels" aria-label="选择难度"><button data-level="easy">轻松 · 6×6</button><button class="on" data-level="medium">适中 · 7×7</button><button data-level="hard">挑战 · 8×8</button></section>
  <p class="tip" id="tip">交换相邻的苗乡好物，连成 3 个或更多</p><section class="board-wrap"><div class="board" id="board" aria-label="消消乐棋盘"></div></section>
  <footer class="footer"><span>苗乡日常，欢喜相连</span><button class="restart" id="restart">重新开始</button></footer><img class="character" src="/消消乐/image/女孩_1.png" alt="">
  <section class="overlay show" id="overlay"><div class="card" id="card"></div></section>
</main>
<script>
const assets=['图案_1.png','图案_2.png','图案_3.png','图案_4.png','图案_5.png','图案_6.png','折耳根.png','木姜籽.png','毛辣果.png','糯米粉.png','腊肉.png','银饰_1.png','银饰_2.png','银饰_3.png','鱼酱.png'];
const configs={easy:{size:6,moves:24,goal:18,name:'轻松游玩'},medium:{size:7,moves:20,goal:24,name:'适中挑战'},hard:{size:8,moves:18,goal:32,name:'高手试炼'}};let level='medium',size,moves,goal,score,cleared,grid,selected=null,busy=false;
const $=id=>document.getElementById(id), board=$('board'), overlay=$('overlay'), card=$('card');
function random(){return Math.floor(Math.random()*(level==='easy'?8:level==='medium'?11:assets.length))}function at(r,c){return r>=0&&c>=0&&r<size&&c<size?grid[r][c]:-1}
function start(next=level){level=next;const cfg=configs[level];size=cfg.size;moves=cfg.moves;goal=cfg.goal;score=cleared=0;selected=null;grid=Array.from({length:size},()=>Array(size).fill(0));for(let r=0;r<size;r++)for(let c=0;c<size;c++){let v;do v=random();while((c>1&&grid[r][c-1]===v&&grid[r][c-2]===v)||(r>1&&grid[r-1][c]===v&&grid[r-2][c]===v));grid[r][c]=v}overlay.classList.remove('show');document.querySelectorAll('.levels button').forEach(b=>b.classList.toggle('on',b.dataset.level===level));render();update();}
function render(){board.style.gridTemplateColumns=`repeat(${size},1fr)`;board.innerHTML='';grid.forEach((row,r)=>row.forEach((v,c)=>{const b=document.createElement('button');b.className='tile';b.dataset.r=r;b.dataset.c=c;b.setAttribute('aria-label','苗乡好物');b.innerHTML=`<img src="/消消乐/image/${assets[v]}" alt="">`;if(selected&&selected[0]===r&&selected[1]===c)b.classList.add('selected');b.onclick=()=>choose(r,c);board.appendChild(b)}));}
function update(){$('moves').textContent=moves;$('score').textContent=score;$('progress').textContent=`${Math.min(cleared,goal)} / ${goal}`;$('progressbar').style.width=`${Math.min(100,cleared/goal*100)}%`;}
function choose(r,c){if(busy||moves<=0)return;if(!selected){selected=[r,c];render();return}const [sr,sc]=selected;if(sr===r&&sc===c){selected=null;render();return}if(Math.abs(sr-r)+Math.abs(sc-c)!==1){selected=[r,c];render();return}swap(sr,sc,r,c);const hits=findMatches();if(!hits.length){swap(sr,sc,r,c);selected=null;$('tip').textContent='这里还连不起来，换一组试试。';render();return}moves--;selected=null;resolve(hits);}
function swap(a,b,c,d){[grid[a][b],grid[c][d]]=[grid[c][d],grid[a][b]]}
function findMatches(){const set=new Set;for(let r=0;r<size;r++){let s=0;for(let c=1;c<=size;c++){if(c<size&&grid[r][c]===grid[r][s])continue;if(c-s>=3)for(let k=s;k<c;k++)set.add(`${r},${k}`);s=c}}for(let c=0;c<size;c++){let s=0;for(let r=1;r<=size;r++){if(r<size&&grid[r][c]===grid[s][c])continue;if(r-s>=3)for(let k=s;k<r;k++)set.add(`${k},${c}`);s=r}}return [...set].map(x=>x.split(',').map(Number))}
function resolve(hits,chain=1){busy=true;$('tip').textContent=chain>1?`连消 ${chain} 次，好样的！`:'苗乡好物消除成功！';hits.forEach(([r,c])=>grid[r][c]=-1);score+=hits.length*10*chain;cleared+=hits.length;render();update();setTimeout(()=>{for(let c=0;c<size;c++){let vals=[];for(let r=size-1;r>=0;r--)if(grid[r][c]!==-1)vals.push(grid[r][c]);for(let r=size-1,i=0;r>=0;r--,i++)grid[r][c]=i<vals.length?vals[i]:random()}const more=findMatches();if(more.length)resolve(more,chain+1);else{busy=false;render();update();if(cleared>=goal)finish(true);else if(moves<=0)finish(false)}},340)}
function finish(win){overlay.classList.add('show');card.innerHTML=win?`<span class="seal">乐</span><h1>苗乡欢喜！</h1><div class="large">${score} 分</div><p>你收集到了 ${cleared} 份苗乡好物。<br>愿这份山间的欢喜，也落在你心上。</p><button id="again">再玩一局</button>`:`<span class="seal">乐</span><h1>再试一次</h1><p>还差 ${Math.max(0,goal-cleared)} 份好物就能完成这一局。<br>留意棋盘中央，常能连出更长的惊喜。</p><button id="again">重新挑战</button>`;$('again').onclick=()=>start()}
function intro(){overlay.classList.add('show');card.innerHTML=`<span class="seal">乐</span><h1>苗乡消消乐</h1><p>把相邻的好物交换位置，连起 3 个或更多即可消除。每一块小图，都来自苗乡的食材、银饰和纹样。</p><div class="difficulty">${Object.entries(configs).map(([key,v])=>`<button data-pick="${key}"><b>${v.name}</b><small>${v.size}×${v.size} 棋盘 · ${v.moves} 步收集 ${v.goal} 份好物</small></button>`).join('')}</div>`;card.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>start(b.dataset.pick));}
document.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>start(b.dataset.level));$('restart').onclick=()=>start();$('help').onclick=intro;intro();
</script></body></html>
