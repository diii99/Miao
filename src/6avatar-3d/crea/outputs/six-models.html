<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Six Miao Girls</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #101015; color: #fff; font: 14px system-ui, sans-serif; }
    canvas { display: block; }
    #status { position: fixed; inset: 18px auto auto 18px; padding: 9px 12px; border-radius: 999px; background: #0009; backdrop-filter: blur(8px); }
    #hint { position: fixed; right: 18px; bottom: 18px; color: #d5d5dc; text-align: right; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="status">Loading models: 0 / 6</div>
  <div id="hint">Drag to orbit &bull; Scroll to zoom</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Keep the six .glb files in this same folder as this HTML file.
    const modelPaths = Array.from({ length: 6 }, (_, i) => `./MiaoGirl_${i + 1}.glb`);
    const status = document.querySelector('#status');
    if (location.protocol === 'file:') {
      status.textContent = 'Open with start-3d-viewer.bat — browsers block 3D files opened directly.';
    }
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#101015');

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(0, 2.8, 16);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.append(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.4, 0);
    controls.enableDamping = true;
    controls.minDistance = 6;
    controls.maxDistance = 32;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x283247, 2.5));
    const key = new THREE.DirectionalLight(0xffffff, 3.5);
    key.position.set(5, 8, 7);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffc9d9, 1.5);
    fill.position.set(-7, 4, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 14),
      new THREE.MeshStandardMaterial({ color: '#252330', roughness: 0.85 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
    scene.add(new THREE.GridHelper(40, 40, 0x454152, 0x302e3a));

    const loader = new GLTFLoader();
    let finished = 0;
    const mixers = [];

    modelPaths.forEach((path, index) => {
      loader.load(path, (gltf) => {
        const model = gltf.scene;
        // Normalize height and align each character's feet to the same floor.
        let bounds = new THREE.Box3().setFromObject(model);
        const height = bounds.max.y - bounds.min.y;
        const scale = 2.8 / height;
        model.scale.setScalar(scale);
        bounds.setFromObject(model);
        model.position.set((index - 2.5) * 1.55, -bounds.min.y, 0);
        scene.add(model);

        if (gltf.animations.length) {
          const mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach(clip => mixer.clipAction(clip).play());
          mixers.push(mixer);
        }
        finished++;
        status.textContent = `Loading models: ${finished} / 6`;
        if (finished === 6) setTimeout(() => status.style.display = 'none', 700);
      }, undefined, () => {
        finished++;
        status.textContent = `Could not load ${path} (${finished} / 6)`;
      });
    });

    const clock = new THREE.Clock();
    function render() {
      const delta = clock.getDelta();
      mixers.forEach(mixer => mixer.update(delta));
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }
    render();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
